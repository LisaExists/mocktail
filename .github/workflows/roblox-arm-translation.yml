name: Roblox ARM translation prototype

on:
  push:
    branches: [experimental/roblox-arm-translation]
    paths:
      - '.github/workflows/roblox-arm-translation.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/translation/**'
      - 'src/translation/**'
      - 'tests/translation/**'
      - 'tests/test_roblox_arm_preflight.py'
      - 'tools/roblox-arm-preflight.py'
      - 'third_party/**'
  pull_request:
    paths:
      - '.github/workflows/roblox-arm-translation.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/translation/**'
      - 'src/translation/**'
      - 'tests/translation/**'
      - 'tests/test_roblox_arm_preflight.py'
      - 'tools/roblox-arm-preflight.py'
      - 'third_party/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roblox-arm-translation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a64-guest-smoke:
    name: AArch64 loader and Dynarmic smoke tests (x86-64)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Mocktail and Dynarmic build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential binutils cmake git ninja-build pkg-config lld \
            libsdl3-dev libsdl3-ttf-dev libcurl4-openssl-dev libssl-dev \
            nlohmann-json3-dev libyaml-dev libelf-dev libminizip-dev \
            libcapstone-dev libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev \
            libutf8proc-dev libfontconfig1-dev libegl-dev libvulkan-dev \
            libplacebo-dev libpng-dev zlib1g-dev libboost-dev \
            gcc-aarch64-linux-gnu python3

      - name: Configure experimental AArch64 guest translation
        run: |
          cmake -S . -B build-arm-translation -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DMOCKTAIL_ENABLE_ROBLOX_ARM_TRANSLATION=ON

      - name: Build only the prototype test targets
        run: |
          cmake --build build-arm-translation --parallel 2 --target \
            mocktail_a64_elf_loader_test mocktail_a64_guest_memory_test \
            mocktail_a64_guest_module_loader_test mocktail_a64_translation_smoke

      - name: Run prototype tests
        run: |
          ctest --test-dir build-arm-translation \
            -R 'RobloxArmTranslation' --output-on-failure --timeout 60
