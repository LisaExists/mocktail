name: ARM64 translation prototype

on:
  push:
    branches:
      - experimental/roblox-arm-translation
    paths:
      - '.github/workflows/arm64-translation.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'docs/ROBLOX_ARM_TRANSLATION.md'
      - 'include/translation/**'
      - 'src/translation/**'
      - 'tests/translation/**'
      - 'tests/test_roblox_arm_preflight.py'
      - 'tests/mocktail_a64_apk_probe_test.py'
      - 'tests/test_a64_elf_audit.py'
      - 'tools/roblox-arm-preflight.py'
      - 'tools/a64-elf-audit.py'
      - 'tools/mocktail-a64-apk-probe.py'
      - 'third_party/**'
      - '.gitmodules'
  pull_request:
    branches:
      - experimental/roblox-arm-translation
    paths:
      - '.github/workflows/arm64-translation.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'docs/ROBLOX_ARM_TRANSLATION.md'
      - 'include/translation/**'
      - 'src/translation/**'
      - 'tests/translation/**'
      - 'tests/test_roblox_arm_preflight.py'
      - 'tests/mocktail_a64_apk_probe_test.py'
      - 'tests/test_a64_elf_audit.py'
      - 'tests/mocktail_a64_apk_probe_test.py'
      - 'tools/roblox-arm-preflight.py'
      - 'tools/a64-elf-audit.py'
      - 'tools/mocktail-a64-apk-probe.py'
      - 'third_party/**'
      - '.gitmodules'
  workflow_dispatch:
    inputs:
      run_real_roblox_apk_smoke:
        description: "Download the pinned Roblox 2.743.1136 ARM64 split and attempt a guest JNI_OnLoad probe"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: arm64-translation-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loader-and-jit-smoke:
    name: ELF loader + Dynarmic smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential binutils cmake git ninja-build pkg-config lld libboost-dev libsdl3-dev libsdl3-ttf-dev libcurl4-openssl-dev libssl-dev nlohmann-json3-dev libyaml-dev libelf-dev libminizip-dev libcapstone-dev libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev libutf8proc-dev libfontconfig1-dev libegl-dev libvulkan-dev libplacebo-dev libpng-dev zlib1g-dev libboost-dev python3 clang gcc-aarch64-linux-gnu

      - name: Configure optional ARM64 translation prototype
        run: |
          cmake -S . -B build-translation-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DMOCKTAIL_ENABLE_ROBLOX_ARM_TRANSLATION=ON

      - name: Build loader and Dynarmic tests
        run: |
          cmake --build build-translation-ci --parallel 4 --target mocktail_a64_elf_loader_test mocktail_a64_guest_memory_test mocktail_a64_guest_module_loader_test mocktail_a64_linux_syscalls_test mocktail_a64_guest_runtime_test mocktail_a64_guest_jni_test mocktail_a64_guest_probe mocktail_a64_android_asset_test mocktail_a64_translation_smoke

      - name: Audit linker-generated ARM64 fixtures
        run: |
          python3 tools/a64-elf-audit.py --strict \
            build-translation-ci/mocktail-a64-guest-smoke.so \
            build-translation-ci/mocktail-a64-guest-syscalls.so \
            build-translation-ci/libmocktail-a64-module-root.so \
            build-translation-ci/libmocktail-a64-module-dependency.so \
            build-translation-ci/libmocktail-a64-module-function-root.so \
            build-translation-ci/mocktail-a64-guest-init.so \
            build-translation-ci/mocktail-a64-guest-tls.so \
            build-translation-ci/mocktail-a64-guest-tlsdesc.so \
            build-translation-ci/mocktail-a64-guest-tls-get-addr.so \
            build-translation-ci/libmocktail-android-style-smoke.so \
            build-translation-ci/libmocktail-android-dl-smoke.so \
            build-translation-ci/libmocktail-android-jni-smoke.so \
            build-translation-ci/libmocktail-android-asset-smoke.so \
            build-translation-ci/android-system-stubs/liblog.so

      - name: Run translation and preflight tests
        run: |
          ctest --test-dir build-translation-ci -R 'RobloxArmTranslation' --output-on-failure --timeout 60

      # This is deliberately manual-only: it downloads a pinned, real Roblox
      # split APK and runs its ARM64 library only inside the Dynarmic guest.
      # SHA-256 pins prevent a mutable external release URL changing the input.
      - name: Download pinned real Roblox APK splits
        if: (github.event_name == 'workflow_dispatch' && inputs.run_real_roblox_apk_smoke) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[real-apk-smoke]'))
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-translation-ci/real-roblox-apk
          base="build-translation-ci/real-roblox-apk/com.roblox.client-18934.apk"
          arm64="build-translation-ci/real-roblox-apk/com.roblox.client-config.arm64_v8a-18934.apk"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/Roblox-DeployHistory-Updates/android-runner/releases/download/18934/com.roblox.client-18934.apk" \
            --output "$base"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/Roblox-DeployHistory-Updates/android-runner/releases/download/18934/com.roblox.client-config.arm64_v8a-18934.apk" \
            --output "$arm64"
          echo "70045d3ec8dbdb818014b64a6460205322c0291bd9f3da1ac6c34aab06835f2d  $base" | sha256sum --check
          echo "3ff701fc7e8a91301bc122fb4cfd7c248f0a14fd4a074cf98f667a8dac6a08c9  $arm64" | sha256sum --check
          printf 'Pinned Roblox Android version: 2.743.1136 (versionCode 18934)\n'
          printf 'Base APK: %s\\nARM64 split: %s\\n' "$base" "$arm64"

      - name: Audit real Roblox APK package
        if: (github.event_name == 'workflow_dispatch' && inputs.run_real_roblox_apk_smoke) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[real-apk-smoke]'))
        shell: bash
        run: |
          set -uo pipefail
          base="build-translation-ci/real-roblox-apk/com.roblox.client-18934.apk"
          arm64="build-translation-ci/real-roblox-apk/com.roblox.client-config.arm64_v8a-18934.apk"
          preflight_log="build-translation-ci/real-roblox-apk/preflight.log"
          audit_log="build-translation-ci/real-roblox-apk/audit.log"
          audit_json="build-translation-ci/real-roblox-apk/audit.json"
          echo '--- ABI preflight (ARM64-on-x86 mismatch is expected for this prototype) ---'
          python3 tools/roblox-arm-preflight.py "$base" "$arm64" | tee "$preflight_log" || true
          echo '--- Native ELF / dependency audit (ARM64 split; base has no native lib directory) ---'
          set +e
          python3 tools/a64-elf-audit.py "$arm64" 2>&1 | tee "$audit_log"
          audit_status=${PIPESTATUS[0]}
          python3 tools/a64-elf-audit.py --json "$arm64" >"$audit_json"
          set -e
          echo "Real Roblox ELF audit exit status: $audit_status"
          if [ "$audit_status" -ne 0 ]; then
            echo "::warning::The real-package audit found malformed or unsupported ELF metadata; still attempting the guest load."
          fi
          exit 0

      - name: Attempt real Roblox native initialization in guest
        if: (github.event_name == 'workflow_dispatch' && inputs.run_real_roblox_apk_smoke) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[real-apk-smoke]'))
        shell: bash
        run: |
          set -uo pipefail
          base="build-translation-ci/real-roblox-apk/com.roblox.client-18934.apk"
          arm64="build-translation-ci/real-roblox-apk/com.roblox.client-config.arm64_v8a-18934.apk"
          log="build-translation-ci/real-roblox-apk/guest-probe.log"
          echo 'Attempting libroblox.so constructors and JNI_OnLoad under the guest runtime.'
          echo 'A nonzero result is an actionable compatibility finding, not a passing launch.'
          set +e
          timeout --signal=TERM --kill-after=10s 180s \
            python3 tools/mocktail-a64-apk-probe.py \
              --probe build-translation-ci/mocktail_a64_guest_probe \
              --root libroblox.so \
              --run-initializers --jni-onload \
              --budget 10000000 --memory-mib 4096 \
              "$base" "$arm64" >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          echo "Real Roblox guest-probe exit status: $status"
          if [ "$status" -eq 0 ]; then
            echo '::notice::The real Roblox libroblox.so initializer/JNI_OnLoad probe completed.'
          else
            echo "::warning::Real Roblox guest initialization stopped at a compatibility blocker (exit $status). See the probe log above."
          fi
          # This exploratory probe is non-gating until the compatibility
          # surface is sufficiently complete for a real client launch.
          exit 0

      - name: Preserve real Roblox probe diagnostics
        if: always() && ((github.event_name == 'workflow_dispatch' && inputs.run_real_roblox_apk_smoke) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[real-apk-smoke]')))
        uses: actions/upload-artifact@v4
        with:
          name: real-roblox-arm64-probe
          path: |
            build-translation-ci/real-roblox-apk/guest-probe.log
            build-translation-ci/real-roblox-apk/preflight.log
            build-translation-ci/real-roblox-apk/audit.log
            build-translation-ci/real-roblox-apk/audit.json
          if-no-files-found: warn
          retention-days: 14
